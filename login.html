<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión | Demo Translogística</title>
<link rel="icon" href="images/favicon-translogistica.png" type="image/png">
<link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/demo.css"></head>
<body><div class="login-page"><main class="login-card">
<img src="images/logo-translogistica.png" alt="Translogística" class="login-logo">
<h1 class="h2 fw-bold mb-3">Iniciar sesión</h1>
<p class="small demo-login-hint">Esta es una demostración visual. No ingreses usuarios ni contraseñas: el formulario no está conectado a un servidor.</p>
<form aria-label="Vista de ejemplo del inicio de sesión">
<div class="mb-3"><label for="usuario" class="form-label fw-semibold">Usuario</label>
<input id="usuario" type="text" class="form-control" placeholder="No disponible en la demo" disabled></div>
<div class="mb-4"><label for="password" class="form-label fw-semibold">Contraseña</label>
<input id="password" type="password" class="form-control" placeholder="No disponible en la demo" disabled></div>
<button type="button" class="btn btn-warning fw-bold w-100" disabled>Ingresar</button></form>
<a href="index.html" class="d-inline-block mt-4">← Volver al inicio</a>
</main></div></body></html>
